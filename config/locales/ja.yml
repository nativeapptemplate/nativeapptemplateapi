# Japanese for the app's own messages. Keep the keys in step with en.yml:
# test/i18n/locale_files_test.rb fails when a key is missing here.
#
# Rails' validation messages are in rails.ja.yml and Devise's in devise.ja.yml.
# devise_token_auth ships its own ja.yml; the keys below override it where
# en.yml overrides the English.

