# Recurring tasks run by the Solid Queue scheduler (started by the Puma plugin).
# https://github.com/rails/solid_queue#recurring-tasks

default: &default
  # Solid Queue keeps finished jobs; delete those older than
  # SolidQueue.clear_finished_jobs_after (1 day by default)
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  <<: *default
