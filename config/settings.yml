# The app's name as people read it, in mails and on the HTML pages. The
# identifier-like names below (site.name, business.name) stay as they are
# for code that needs a one-word name.
display_name: Native App Template

site:
  name: NativeAppTemplate
  domain: nativeapptemplate.com
  url: https://nativeapptemplate.com

business:
  name: NativeAppTemplate

email:
  support: support@nativeapptemplate.com
  support_with_name: Native App Template <support@nativeapptemplate.com>
  default_from: noreply@nativeapptemplate.com
  default_from_with_name: Native App Template <noreply@nativeapptemplate.com>

app:
  domain: api.nativeapptemplate.com

# Store links in the invitation mail. Each is left out of the mail while
# blank; set them once the apps are published, e.g.
#   app_store_url: https://apps.apple.com/app/<name>/id<number>
#   play_store_url: https://play.google.com/store/apps/details?id=<package>
mobile_app:
  app_store_url: ""
  play_store_url: ""

minimum_password_length: 8

shop:
  limit_count: 99

account:
  limit_count: 99

accounts_shopkeeper:
  limit_count: 99

accounts_invitation:
  expires_in_hours: 48

item_tag:
  limit_count: 99
