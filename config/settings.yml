# The app's name as people read it, in mails and on the HTML pages. The
# identifier-like names below (site.name, business.name) stay as they are
# for code that needs a one-word name.
display_name: Native App Template

site:
  name: NativeAppTemplate
  domain: nativeapptemplate.com
  url: https://nativeapptemplate.com

business:
  name: NativeAppTemplate

email:
  support: support@nativeapptemplate.com
  support_with_name: Native App Template <support@nativeapptemplate.com>
  default_from: noreply@nativeapptemplate.com
  default_from_with_name: Native App Template <noreply@nativeapptemplate.com>

app:
  domain: api.nativeapptemplate.com

# Store links in the invitation mail. Each is left out of the mail while
# blank; set them once the apps are published, e.g.
#   app_store_url: https://apps.apple.com/app/<name>/id<number>
#   play_store_url: https://play.google.com/store/apps/details?id=<package>
mobile_app:
  app_store_url: ""
  play_store_url: ""

# The invitation mail's link, https://<app.domain>/invitations/<code>, opens
# the app (iOS Universal Links, Android App Links). This API serves the files
# that let the apps claim the link, /.well-known/apple-app-site-association
# and /.well-known/assetlinks.json, from these values; each file is 404 while
# its values are blank, and the link then opens a page in the browser. Set
# them here, or comma-separated in the deploy's env (config/deploy.yml
# env.clear), e.g.
#   APP_LINKS_IOS_APP_IDS: ABCDE12345.com.example.MyApp.ios (Team ID.bundle ID)
#   APP_LINKS_ANDROID_PACKAGE: com.example.myapp (applicationId)
#   APP_LINKS_ANDROID_SHA256_CERT_FINGERPRINTS: AA:BB:...,CC:DD:... (the
#     signing certificates' SHA-256: Play App Signing's from Play Console >
#     Test and release > App integrity, and the debug keystore's for local
#     builds, from ./gradlew signingReport)
app_links:
  ios_app_ids: <%= ENV.fetch("APP_LINKS_IOS_APP_IDS", "").split(",").map(&:strip).to_json %>
  android_package: <%= ENV.fetch("APP_LINKS_ANDROID_PACKAGE", "").to_json %>
  android_sha256_cert_fingerprints: <%= ENV.fetch("APP_LINKS_ANDROID_SHA256_CERT_FINGERPRINTS", "").split(",").map(&:strip).to_json %>

minimum_password_length: 8

shop:
  limit_count: 99

account:
  limit_count: 99

accounts_shopkeeper:
  limit_count: 99

accounts_invitation:
  expires_in_hours: 48

item_tag:
  limit_count: 99
