name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to a pull request makes the run for the older commit pointless,
# so stop it. Runs on main are left to finish so every merge gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The steps are in config/ci.rb, the same ones bin/ci runs locally, so a new
  # step goes there and nowhere else
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Pinned so a new Postgres major only arrives on purpose
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # bin/setup prepares and seeds this database; with RAILS_ENV=test the
    # tests and the seed step use the same one
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/test
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run bin/ci
        run: bin/ci
